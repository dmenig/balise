[project]
name = "balise"
version = "0.1.0"
description = "Balise monorepo dev environment (api + ingest + workers)"
requires-python = ">=3.12"
dependencies = [
    "balise-api",
    "balise-ingest",
    "balise-workers",
    # The Streamlit app's own dependencies, duplicated from requirements.txt on purpose.
    # A host picking up uv.lock instead of requirements.txt — Streamlit Community Cloud
    # prefers a lockfile — would otherwise build an environment with the API stack and no
    # streamlit, pydeck, pandas or pyarrow in it, and run the app against whatever streamlit
    # the platform happens to ship. Every layout rule keys off internal DOM hooks, so that
    # renders the page as a plain document. Keep the two files in step.
    "streamlit==1.61.1",
    "pydeck==0.9.3",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "testcontainers>=4.8",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
    "types-python-jose>=3.5.0.20260408",
    "boto3-stubs>=1.43.65",
    # `shot.py`: the map app is a UI, and a UI is reviewed by looking at it.
    "playwright>=1.49",
]

[tool.uv.workspace]
members = ["api", "ingest", "workers"]

[tool.uv.sources]
balise-api = { workspace = true }
balise-ingest = { workspace = true }
balise-workers = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "raw", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# B008: FastAPI dependency defaults. RUF001-003: the product is French — « × », « → » and
# non-breaking spaces in strings and docstrings are intentional, not typos.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "api/src:ingest/src:workers/src"
explicit_package_bases = true
exclude = ["^web/", "^raw/"]

[[tool.mypy.overrides]]
module = [
    "geoalchemy2.*",
    "shapely.*",
    "mapbox_vector_tile.*",
    "testcontainers.*",
    "apscheduler.*",
    "pandas.*",
    "pydeck.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# v1 gate. The v2 availability suite (api/tests/v2, workers/tests/v2) runs via `make test-v2`.
testpaths = ["api/tests", "ingest/tests", "workers/tests"]
norecursedirs = ["v2", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
filterwarnings = ["error::DeprecationWarning:balise_.*"]
