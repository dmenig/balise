[project]
name = "balise-api"
version = "0.1.0"
description = "Balise REST/MVT/WS API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.15",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "python-jose[cryptography]>=3.3",
    "typer>=0.13",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
]

[project.scripts]
balise-admin = "balise_api.admin_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balise_api"]
