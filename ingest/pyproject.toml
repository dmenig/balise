[project]
name = "balise-ingest"
version = "0.1.0"
description = "Balise data ingestion CLI (fetch, normalise, conflate, load)"
requires-python = ">=3.12"
dependencies = [
    "balise-api",
    "typer>=0.13",
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.7",
    "pyyaml>=6.0",
]

[project.scripts]
balise-ingest = "balise_ingest.cli:app"
balise-audit = "balise_ingest.audit:app"
balise-mbfs = "balise_ingest.mbfs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balise_ingest"]

[tool.uv.sources]
balise-api = { workspace = true }
